backend:
  name: turbo-github
  turbo_site_id: "54d37dbb-e52b-4f71-8b76-cd0bfa4cf6f2"
  branch: main

media_folder: "images/events"
public_folder: "/images/events"

collections:
  - name: "gallery"
    label: "행사 갤러리"
    files:
      - name: "gallery"
        label: "갤러리 항목 관리"
        file: "content/gallery.json"
        fields:
          - label: "사진/영상 목록"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "사진", name: "image", widget: "image", required: false, hint: "영상을 쓸 경우 사진은 비워두셔도 됩니다." }
              - { label: "영상 링크 (유튜브 또는 인스타그램 URL)", name: "video", widget: "string", required: false }
              - { label: "설명 문구", name: "caption", widget: "string" }
